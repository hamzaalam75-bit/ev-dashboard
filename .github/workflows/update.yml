name: Update EV data

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          NREL_API_KEY: ${{ secrets.NREL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: python run_pipeline.py
      - name: Commit new data
        run: |
          git config user.name "ev-bot"
          git config user.email "ev-bot@users.noreply.github.com"
          git add data ev_dashboard_data.xlsx
          git diff --staged --quiet || git commit -m "Auto update data"
          git push
